# Supabase CLI config -- SkillsetMind / skillset-foundation
#
# Written on 2026-07-21 together with the baseline remote_schema_2026-07-21.sql.
# The repository had no config.toml, which was one of the reasons the database
# could not be rebuilt from the code.
#
# major_version = 17, confirmed on the remote with "show server_version" -> 17.6.
#
# It lives in supabase/config.toml because that is the only path the CLI reads.

project_id = "ijtikldtjvsbtwszokvs"

[api]
enabled = true
port = 54321
schemas = ["public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 17

[studio]
enabled = true
port = 54323

[auth]
enabled = true
