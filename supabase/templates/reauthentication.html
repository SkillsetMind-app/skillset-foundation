<!-- Supabase Auth email template: Reauthentication.
     Paste into Dashboard > Authentication > Emails > "Reauthentication".
     Subject line: Your Skillset Mind verification code
     Variable: {{ .Token }} = 6-digit code (this template uses a CODE, not a link). -->
<html>
  <body style="margin:0;padding:0;background-color:#f5f5f3;">
    <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background-color:#f5f5f3;padding:32px 0;">
      <tr>
        <td align="center">
          <table role="presentation" width="560" cellpadding="0" cellspacing="0" style="max-width:560px;width:100%;">
            <tr>
              <td style="background-color:#0f0f0f;border-radius:14px 14px 0 0;padding:30px 40px;text-align:center;">
                <span style="font-family:'Montserrat','Segoe UI',Helvetica,Arial,sans-serif;font-size:21px;font-weight:bold;letter-spacing:3px;color:#ffffff;">SKILLSET</span>
                <span style="font-family:'Montserrat','Segoe UI',Helvetica,Arial,sans-serif;font-size:21px;font-weight:bold;letter-spacing:3px;color:#b3914b;">&nbsp;MIND</span>
              </td>
            </tr>
            <tr>
              <td style="background-color:#ffffff;padding:40px;border:1px solid #e6e6e3;border-top:none;">
                <h1 style="margin:0 0 16px;font-family:'Montserrat','Segoe UI',Helvetica,Arial,sans-serif;font-size:22px;line-height:1.35;color:#111111;">
                  Confirm it's you.
                </h1>
                <p style="margin:0 0 24px;font-family:'Segoe UI',Helvetica,Arial,sans-serif;font-size:15px;line-height:1.7;color:#4a4a48;">
                  Use this code to confirm the action on your Skillset Mind
                  account. It expires shortly &mdash; don't share it with anyone.
                </p>
                <div style="margin:0 0 8px;padding:18px 0;background-color:#f0f0ee;border:1px solid #e6e6e3;border-radius:10px;text-align:center;font-family:'Montserrat','Segoe UI',Helvetica,Arial,sans-serif;font-size:30px;font-weight:bold;letter-spacing:8px;color:#111111;">
                  {{ .Token }}
                </div>
                <p style="margin:16px 0 0;font-family:'Segoe UI',Helvetica,Arial,sans-serif;font-size:13px;line-height:1.6;color:#8a8a86;">
                  If you didn't try to do this, ignore this email and consider
                  changing your password.
                </p>
              </td>
            </tr>
            <tr>
              <td style="background-color:#f0f0ee;border-radius:0 0 14px 14px;padding:20px 40px;border:1px solid #e6e6e3;border-top:none;">
                <p style="margin:0;font-family:'Segoe UI',Helvetica,Arial,sans-serif;font-size:12px;line-height:1.7;color:#8a8a86;text-align:center;">
                  Questions? <a href="mailto:support@skillsetmind.com" style="color:#111111;font-weight:bold;">support@skillsetmind.com</a>
                </p>
              </td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
