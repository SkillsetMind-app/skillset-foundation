name: Security

permissions:
  contents: read

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Weekly full history secret scan (Sunday 06:00 UTC)
    - cron: "0 6 * * 0"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secrets:
    name: TruffleHog secrets scan
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history so leaked secrets in old commits still fail the gate.
          fetch-depth: 0

      - name: TruffleHog (verified secrets only)
        uses: trufflesecurity/trufflehog@e76dff8a7e57d6df0c60ad8cbf5d5cba505a8fc9
        with:
          path: ./
          # On a push to main and on the weekly cron, `base` and `head` would be
          # the SAME commit: the main..main range is empty, TruffleHog inspects
          # zero commits and the job ends GREEN without having scanned anything —
          # the opposite of what the `fetch-depth: 0` above and the "full
          # history" comment promise. Leaving both empty outside a PR makes it
          # scan the full history, which is the original intent.
          base: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || '' }}
          head: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || '' }}
          extra_args: --only-verified --results=verified

  sast:
    name: Semgrep SAST
    runs-on: ubuntu-latest
    timeout-minutes: 20
    container:
      # Pinned by digest for the same reason as the actions above: with no tag
      # or digest the runner pulls whatever is in the registry at that minute,
      # and a SAST that changes by itself is not a gate, it is an attack surface.
      image: semgrep/semgrep@sha256:51c9f53a4fce0d55e9abd08d7b96968654248a4b1122e77f20e0a49c0072446c # 1.175.1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Semgrep CI (p/typescript + p/security-audit + p/secrets)
        run: |
          semgrep scan \
            --config p/typescript \
            --config p/security-audit \
            --config p/secrets \
            --error \
            --metrics=off \
            --exclude=node_modules \
            --exclude=.next \
            --exclude=functions/lib \
            src/

  deps:
    name: npm audit (high+)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      # The npm that ships with Node 22 talks to the legacy audit endpoint
      # (/-/npm/v1/security/audits/quick), which the registry is retiring and
      # already answers with 400. npm keeps insisting, the job blows the 10
      # minutes and dies with the generic message "Invalid package tree, run npm
      # install" -- which has nothing to do with the lockfile and sent more than
      # one reader to regenerate the lock for nothing. npm 11 uses the bulk
      # endpoint and passes with the same lock.
      - name: Use npm 11 (the legacy audit endpoint 400s on npm 10)
        run: npm i -g npm@^11
      - name: Install dependencies
        run: npm ci
      - name: Audit production deps (high and critical)
        # Block on a VULNERABILITY, never on a third party being unavailable.
        #
        # Both npm audit endpoints have been unstable: the legacy one
        # (security/audits/quick) answers 400 because it is being retired, and the
        # current one (security/advisories/bulk) returned 503 on 04/09 with exactly
        # the same lockfile that passes on the dev's machine. A gate that closes
        # because the registry went down does not measure security, it measures
        # luck -- and the real cost is worse than a false red: it teaches the team
        # to ignore red.
        #
        # So the distinction is explicit. Found a high/critical vulnerability:
        # close the gate. Could not ask: try again, and then warn loudly without
        # blocking the merge. Dependabot covers the same repo by another path and
        # does not depend on this endpoint.
        #
        # The two time limits matter as much as the retry. With a 400 npm gives
        # up in 3 seconds, but with a 503 it reads "try again" and enters an
        # internal backoff of FIVE minutes -- which, multiplied by a naive
        # external retry, blows the job cap and comes back as "cancelled", which
        # is worse than red: it says nothing. --fetch-retries=0 removes the inner
        # backoff, and the 60s timeout is the network underneath, for the case
        # where the connection hangs with no error at all. Worst case: 3 x 70s,
        # with room to spare under the job's 10 minutes even counting npm ci.
        run: |
          set +e
          for attempt in 1 2 3; do
            output=$(timeout 60 npm audit --omit=dev --audit-level=high --fetch-retries=0 2>&1)
            code=$?
            if [ "$code" -eq 0 ]; then
              echo "$output"
              exit 0
            fi
            if [ "$code" -eq 124 ] || echo "$output" | grep -q "audit endpoint returned an error"; then
              if [ "$code" -eq 124 ]; then
                echo "Attempt $attempt of 3: the registry did not answer within 60s."
              else
                echo "Attempt $attempt of 3: the audit registry returned an error."
                echo "$output" | grep -E "npm warn audit|npm error" | head -3
              fi
              sleep 10
              continue
            fi
            # Got here: npm managed to ask and the answer was bad.
            # This is the gate, and now is when it closes.
            echo "$output"
            exit 1
          done
          echo "::warning::npm audit did not run: the registry returned an error on all 3 attempts. This is NOT a sign that the dependencies are clean -- Dependabot still covers the repo."
          exit 0
