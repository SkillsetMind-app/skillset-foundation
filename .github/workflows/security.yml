name: Security

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Weekly full history secret scan (Sunday 06:00 UTC)
    - cron: "0 6 * * 0"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secrets:
    name: TruffleHog secrets scan
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history so leaked secrets in old commits still fail the gate.
          fetch-depth: 0

      - name: TruffleHog (verified secrets only)
        uses: trufflesecurity/trufflehog@main
        with:
          path: ./
          # Num push para main e no cron semanal, `base` e `head` seriam o MESMO
          # commit: o intervalo main..main é vazio, o TruffleHog inspeciona zero
          # commits e o job termina VERDE sem ter varrido nada — o oposto do que
          # o `fetch-depth: 0` acima e o comentário "full history" prometem.
          # Deixar os dois vazios fora de PR faz a varredura completa do
          # histórico, que é a intenção original.
          base: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || '' }}
          head: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || '' }}
          extra_args: --only-verified --results=verified

  sast:
    name: Semgrep SAST
    runs-on: ubuntu-latest
    timeout-minutes: 20
    container:
      image: semgrep/semgrep
    steps:
      - uses: actions/checkout@v4

      - name: Semgrep CI (p/typescript + p/security-audit + p/secrets)
        run: |
          semgrep scan \
            --config p/typescript \
            --config p/security-audit \
            --config p/secrets \
            --error \
            --metrics=off \
            --exclude=node_modules \
            --exclude=.next \
            --exclude=functions/lib \
            src/

  deps:
    name: npm audit (high+)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Audit production deps (high and critical)
        # Do not fail on moderate noise; block high/critical only.
        run: npm audit --omit=dev --audit-level=high
