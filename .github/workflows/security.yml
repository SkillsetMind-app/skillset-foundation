name: Security

permissions:
  contents: read

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Weekly full history secret scan (Sunday 06:00 UTC)
    - cron: "0 6 * * 0"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secrets:
    name: TruffleHog secrets scan
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # Full history so leaked secrets in old commits still fail the gate.
          fetch-depth: 0

      - name: TruffleHog (verified secrets only)
        uses: trufflesecurity/trufflehog@363923b901c911a9164f50b6c423f47c15372b1c
        with:
          path: ./
          # Num push para main e no cron semanal, `base` e `head` seriam o MESMO
          # commit: o intervalo main..main é vazio, o TruffleHog inspeciona zero
          # commits e o job termina VERDE sem ter varrido nada — o oposto do que
          # o `fetch-depth: 0` acima e o comentário "full history" prometem.
          # Deixar os dois vazios fora de PR faz a varredura completa do
          # histórico, que é a intenção original.
          base: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || '' }}
          head: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || '' }}
          extra_args: --only-verified --results=verified

  sast:
    name: Semgrep SAST
    runs-on: ubuntu-latest
    timeout-minutes: 20
    container:
      # Fixada por digest pela mesma razao das actions acima: sem tag nem digest
      # o runner puxa o que estiver no registry naquele minuto, e um SAST que
      # muda sozinho nao e um portao, e uma superficie.
      image: semgrep/semgrep@sha256:51c9f53a4fce0d55e9abd08d7b96968654248a4b1122e77f20e0a49c0072446c # 1.175.1
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Semgrep CI (p/typescript + p/security-audit + p/secrets)
        run: |
          semgrep scan \
            --config p/typescript \
            --config p/security-audit \
            --config p/secrets \
            --error \
            --metrics=off \
            --exclude=node_modules \
            --exclude=.next \
            --exclude=functions/lib \
            src/

  deps:
    name: npm audit (high+)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      # O npm que vem com o Node 22 fala com o endpoint legado de auditoria
      # (/-/npm/v1/security/audits/quick), que o registry esta aposentando e ja
      # responde 400. O npm insiste, o job estoura os 10 minutos e morre com a
      # mensagem generica "Invalid package tree, run npm install" -- que nao tem
      # nada a ver com o lockfile e mandou mais de um leitor regenerar o lock a
      # toa. O npm 11 usa o endpoint bulk e passa com o mesmo lock.
      - name: Use npm 11 (the legacy audit endpoint 400s on npm 10)
        run: npm i -g npm@^11
      - name: Install dependencies
        run: npm ci
      - name: Audit production deps (high and critical)
        # Bloqueia por VULNERABILIDADE, nunca por indisponibilidade de terceiro.
        #
        # Os dois endpoints de auditoria do npm andam instaveis: o legado
        # (security/audits/quick) responde 400 porque esta sendo aposentado, e o
        # atual (security/advisories/bulk) devolveu 503 em 04/09 com exatamente o
        # mesmo lockfile que passa na maquina do dev. Um portao que fecha porque
        # o registry caiu nao mede seguranca, mede sorte -- e o custo real e pior
        # que o falso vermelho: ensina o time a ignorar vermelho.
        #
        # Entao a distincao e explicita. Achou vulnerabilidade high/critical:
        # fecha. Nao conseguiu perguntar: tenta de novo, e depois avisa alto sem
        # travar o merge. O Dependabot cobre o mesmo repo por outro caminho e nao
        # depende deste endpoint.
        run: |
          set +e
          for tentativa in 1 2 3; do
            saida=$(npm audit --omit=dev --audit-level=high 2>&1)
            codigo=$?
            if [ "$codigo" -eq 0 ]; then
              echo "$saida"
              exit 0
            fi
            if echo "$saida" | grep -q "audit endpoint returned an error"; then
              echo "Tentativa $tentativa de 3: o registry de auditoria respondeu erro."
              echo "$saida" | grep -E "npm warn audit|npm error" | head -3
              sleep 20
              continue
            fi
            # Chegou aqui: o npm conseguiu perguntar e a resposta foi ruim.
            # Este e o portao, e e agora que ele fecha.
            echo "$saida"
            exit 1
          done
          echo "::warning::npm audit nao rodou: o registry respondeu erro nas 3 tentativas. Isto NAO e um sinal de que as dependencias estao limpas -- o Dependabot segue cobrindo o repo."
          exit 0
