name: Stripe attention

# Hourly tick for /api/cron/stripe-attention: tells ops when a Stripe event did
# not finish processing (someone may have paid without getting access). Also
# knocks on /api/cron/ops-inbox: tickets, reports and verifications waiting.
# And checks /, /login and /courses answer 200 (uptime alert via the ops relay).
# A second job knocks on /api/cron/confirmation-reminder: one "confirm your
# email" email ~24 h after signup.
#
# Lives here and not in vercel.json because Vercel Hobby crons run at most once
# a day. The routes decide whether to alert; this job only knocks on the door.

permissions: {}

on:
  schedule:
    - cron: "7 * * * *"
  workflow_dispatch:
    inputs:
      max_age_hours:
        description: "Confirmation reminder catch-up: also remind accounts up to this many hours old (e.g. 2160 = 90 days). Leave empty for a normal run of every job."
        required: false
        default: ""

concurrency:
  group: stripe-attention
  cancel-in-progress: false

jobs:
  check:
    name: Check stuck Stripe events and the ops inbox
    # A reminder catch-up runs the reminder job alone: no repeat ops alerts.
    if: ${{ github.event_name == 'schedule' || inputs.max_age_hours == '' }}
    runs-on: ubuntu-latest
    # Site fully down: 2x60 s cron calls + 3x(2x20 s) page checks + 3x20 s
    # alerts ~ 5 min. Five would cancel the job right before it alerts.
    timeout-minutes: 8
    steps:
      # Without the value the call would only ever get 401 — fail loudly instead.
      - name: Call the check
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$CRON_SECRET" ]; then
            echo "::error title=Stripe attention not configured::Missing repository secret CRON_SECRET (same value as on Vercel)."
            exit 1
          fi
          # The repo is public, so this log is too: print the status line only,
          # never the JSON body. -f still fails the run on 401/500.
          curl -fsS -o /dev/null -w 'HTTP %{http_code}\n' --max-time 60 \
            -H "Authorization: Bearer $CRON_SECRET" \
            https://www.skillsetmind.com/api/cron/stripe-attention

      # Tickets, reports and verifications waiting for staff. Runs even when the
      # Stripe step failed, so one red check never mutes the other.
      - name: Call the ops inbox check
        if: ${{ !cancelled() }}
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$CRON_SECRET" ]; then
            echo "::error title=Ops inbox not configured::Missing repository secret CRON_SECRET (same value as on Vercel)."
            exit 1
          fi
          curl -fsS -o /dev/null -w 'HTTP %{http_code}\n' --max-time 60 \
            -H "Authorization: Bearer $CRON_SECRET" \
            https://www.skillsetmind.com/api/cron/ops-inbox

      # Uptime from outside Vercel: instrumentation.ts only reports 5xx the app
      # itself sees, so a dead deploy or DNS says nothing. Anything but 200 goes
      # to the same relay as sendOpsAlert (n8n -> Telegram), URL + code only.
      # --retry 1 re-tries a timeout/5xx once; 000 means no answer at all.
      - name: Check the site is up
        if: ${{ !cancelled() }}
        env:
          OPS_ALERT_WEBHOOK_URL: ${{ secrets.OPS_ALERT_WEBHOOK_URL }}
          OPS_ALERT_WEBHOOK_SECRET: ${{ secrets.OPS_ALERT_WEBHOOK_SECRET }}
        run: |
          down=0
          for url in https://www.skillsetmind.com/ https://www.skillsetmind.com/login https://www.skillsetmind.com/courses; do
            code=$(curl -sS -L -o /dev/null -w '%{http_code}' --max-time 20 --retry 1 "$url") || true
            echo "$url HTTP $code"
            [ "$code" = "200" ] && continue
            down=1
            echo "::error title=Site down::$url HTTP $code"
            if [ -z "$OPS_ALERT_WEBHOOK_URL" ]; then
              echo "::error title=Uptime alert not sent::Missing repository secret OPS_ALERT_WEBHOOK_URL."
              continue
            fi
            # x-ops-secret only when set, same as alert.ts. No -S and stderr
            # dropped: curl's own error names the relay host, and the log is public.
            jq -n --arg s "$url HTTP $code" --arg at "$(date -u +%FT%TZ)" \
              '{source:"skillsetmind", event:"uptime_down", severity:"critical", summary:$s, at:$at}' \
              | curl -fs -o /dev/null -w 'alert HTTP %{http_code}\n' --max-time 20 \
                  -H 'content-type: application/json' \
                  ${OPS_ALERT_WEBHOOK_SECRET:+-H "x-ops-secret: $OPS_ALERT_WEBHOOK_SECRET"} \
                  --data-binary @- "$OPS_ALERT_WEBHOOK_URL" 2>/dev/null \
              || echo "::error title=Uptime alert not delivered::The relay did not accept the alert for $url."
          done
          exit $down

  # One reminder per unconfirmed account, 24-72 h after signup. Its own job, so
  # a red reminder never turns the Stripe check red; the workflow's concurrency
  # group keeps a manual catch-up and the hourly run from ever overlapping. The
  # route marks each account before sending, so a re-run never repeats an email.
  confirmation-reminder:
    name: Send email confirmation reminders
    runs-on: ubuntu-latest
    # Catch-up: up to 20 calls of ~30 s (60 s at most) each.
    timeout-minutes: 25
    steps:
      - name: Call the reminder
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          # Through env, never pasted into the script: the input is free text.
          MAX_AGE_HOURS: ${{ inputs.max_age_hours }}
        run: |
          if [ -z "$CRON_SECRET" ]; then
            echo "::error title=Confirmation reminder not configured::Missing repository secret CRON_SECRET (same value as on Vercel)."
            exit 1
          fi
          url=https://www.skillsetmind.com/api/cron/confirmation-reminder
          calls=1
          # Hourly: one call, up to 25 emails. Manual catch-up: a wider window,
          # and calls repeat while each one still sends something.
          if [ -n "$MAX_AGE_HOURS" ]; then
            case "$MAX_AGE_HOURS" in
              *[!0-9]*) echo "::error title=Bad input::max_age_hours must be a whole number of hours."; exit 1 ;;
            esac
            url="$url?max_age_hours=$MAX_AGE_HOURS"
            calls=20
          fi
          ok=1
          for i in $(seq "$calls"); do
            # Public log: the status line only. The body (counts) stays in a file.
            # Removed first, so a failed call never re-reads the previous answer.
            rm -f body.json
            code=$(curl -sS -o body.json -w '%{http_code}' --max-time 60 \
              -H "Authorization: Bearer $CRON_SECRET" "$url") || code=000
            echo "call $i: HTTP $code"
            # Any failed call makes the run red, not only the last one.
            [ "$code" = 200 ] || ok=0
            # A call that sent nothing means done: nothing due, or every account
            # still due failed (due === failed, and the answer is 500).
            jq -e '.sent > 0' body.json >/dev/null 2>&1 || break
          done
          if [ "$calls" -gt 1 ] && jq -e '.sent > 0' body.json >/dev/null 2>&1; then
            echo "::warning title=Catch-up not finished::Every call still sent emails. Run it again with the same input."
          fi
          [ "$ok" = 1 ]
