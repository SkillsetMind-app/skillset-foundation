name: PR gatekeeper

# Reads the diff of each PR and asks GLM-5: "does this open any door?".
# It does not replace Semgrep (known patterns); it catches wrong logic — the
# class of bug that produced the currency without validation and the base
# without head.
#
# Rules this file follows:
#   - A job separate from the existing ones: the `checks` build runs out of
#     memory intermittently and must not hide the verdict — nor the reverse.
#   - PUBLIC repo: the PR comment and the log carry ONLY THE SCOREBOARD. The
#     detail goes to the private channel (n8n ops-alert webhook -> Telegram).
#   - No key => "NOT ANALYZED" and the check FAILS. Do not repeat the `exit 0`
#     that left the RLS check green for two months without running.
#   - A fork PR gets no secret => it falls into the case above. Do not use
#     pull_request_target with a checkout of the fork to get around it: that
#     is running untrusted code with the repo secrets in hand.
#   - Dependabot does not get the repo secrets either; a lockfile bump is not
#     what this gate exists to read, and `npm audit` already covers it. It
#     stays out.
#
# Mode: repository variable PORTEIRO_MODO, values: warn (the default) or block;
# the old values avisa (= warn) and barra (= block) are still accepted. In
# "block", a blocking finding fails the check. It starts in "warn" until the
# analyzer passes an adversarial test (an instruction planted in the diff).
#
# Interface across the merge: on a PR this file comes from the PR, but the
# script comes from the default branch (step "Extract the gate from the default
# branch"). Until the default branch has the English names, this file keeps
# passing the old ones (--nomes, --placar, avisa), which both versions accept.

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

concurrency:
  group: porteiro-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

jobs:
  porteiro:
    name: PR gatekeeper (security, GLM-5)
    if: github.event.pull_request.draft == false && github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    # 30: each reasoning reserve takes ~1 min per attempt (up to 3 caps).
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      # Diff from the base to the PR tip, WITHOUT an exclusion pathspec: an
      # ':(exclude)*.png' also drops the folder src/app/api/x.png/. Binary
      # images and fonts are skipped in the script (last path segment, every
      # name in the block, truly binary); a lockfile is a risk path and is read.
      # --text --no-textconv --no-ext-diff: neither `* -diff` in .gitattributes
      # nor a NUL byte hides code behind "Binary files ... differ" (whatever is
      # left that way gives 3 in the script).
      # core.quotePath=false: a non-ASCII path comes out raw in the header.
      # Quotes, backslash and control characters stay quoted; the script reads
      # both forms and gives 3 (not 0) if a header it does not recognize is left.
      # pr.names: what the PR touches, according to git; a file that does not
      # show up in the diff gives PARTIAL (3), never 0. One command per line:
      # the test runs both.
      # --no-renames: `git mv src/proxy.ts src/proxy.png` becomes delete + create,
      # and the model reads the deleted code (a 100% rename carries no content).
      - name: PR diff
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          git -c core.quotePath=false diff --no-color --text --no-textconv --no-ext-diff --no-renames "$BASE...$HEAD" > "$RUNNER_TEMP/pr.diff"
          git -c core.quotePath=false diff --name-only -z --no-renames "$BASE...$HEAD" > "$RUNNER_TEMP/pr.names"
          echo "diff: $(wc -c < "$RUNNER_TEMP/pr.diff") bytes"

      # The gate of the DEFAULT BRANCH judges the PR, never the PR's copy nor
      # the base's. `pull_request` checks out the PR merge, and this job gets the
      # secrets: running `scripts/porteiro.py` from the checkout means running PR
      # code with the keys in hand. A fork PR gets no secret, but an internal PR
      # does — and an agent with write access opens internal PRs.
      # The base will not do either: whoever opens the PR picks the base branch,
      # and could point it at their own branch with a fake gate. And an old base
      # (without the file, or from before the names flag) left the PR red with
      # no analysis.
      # The default branch name comes from the repository metadata, which the PR
      # does not control. The named fetch guarantees the ref (never FETCH_HEAD),
      # and the read uses the FULL NAME refs/remotes/origin/...: with fetch-depth
      # 0 the checkout downloads all tags, and a tag "origin/main" would beat the
      # short name "origin/main" (git only warns "ambiguous") — swapping the gate
      # for every PR.
      # `cat-file blob`, not `show`: it is the plumbing command whose output is
      # the raw blob, with no textconv, filter or line-ending conversion (that
      # only happens with --filters/--textconv, which we do not use). The PR's
      # .gitattributes has no way to touch the bytes of the gate that will judge
      # it.
      # `git fetch` or `git cat-file` fail => the step fails => red check.
      # NO timeout-minutes on purpose: test_E takes the SMALLEST timeout-minutes
      # in the file as the cap of the chain. And the destination cannot be
      # "$RUNNER_TEMP/pr.*": workflow_commands() matches that pattern to run
      # the real diff.
      # It does not close the hole by itself: this file is still the PR's copy.
      - name: Extract the gate from the default branch
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          git fetch --no-tags origin "+refs/heads/$DEFAULT_BRANCH:refs/remotes/origin/$DEFAULT_BRANCH"
          mkdir -p "$RUNNER_TEMP/default-branch-gate"
          git cat-file blob "refs/remotes/origin/$DEFAULT_BRANCH:scripts/porteiro.py" > "$RUNNER_TEMP/default-branch-gate/porteiro.py"
          echo "gate from origin/$DEFAULT_BRANCH ($(git rev-parse --short "refs/remotes/origin/$DEFAULT_BRANCH")): $(wc -c < "$RUNNER_TEMP/default-branch-gate/porteiro.py") bytes"

      # continue-on-error: the scoreboard must be published even when the
      # verdict is "not analyzed" or "blocking". The final step replays the failure.
      # Fallback chain: with no verdict from GLM (no balance, key refused, API
      # down), it tries Kimi k3 -> Kimi k2.6 -> OpenAI. A secret that does not
      # exist arrives empty and the provider is skipped. vars.PORTEIRO_CADEIA
      # changes the order/models.
      # --nomes/--placar: the old names of --names/--scoreboard (see the top).
      - name: Analyze with GLM-5 (and fallbacks)
        id: analyze
        continue-on-error: true
        # The chain stops by itself at TOTAL_DEADLINE (25 min, scripts/porteiro.py);
        # 27 guarantees the scoreboard is still published within the job's 30.
        timeout-minutes: 27
        env:
          GLM_API_KEY: ${{ secrets.GLM_API_KEY }}
          KIMI_API_KEY: ${{ secrets.KIMI_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          PORTEIRO_CADEIA: ${{ vars.PORTEIRO_CADEIA }}
          OPS_ALERT_WEBHOOK_URL: ${{ secrets.OPS_ALERT_WEBHOOK_URL }}
          OPS_ALERT_WEBHOOK_SECRET: ${{ secrets.OPS_ALERT_WEBHOOK_SECRET }}
          PORTEIRO_MODO: ${{ vars.PORTEIRO_MODO || 'avisa' }}
          PORTEIRO_MODELO: ${{ vars.PORTEIRO_MODELO || 'glm-5' }}
          # Billing packages include extensive tests: read the whole diff.
          # Above this cap it stays PARTIAL and fails, without dismissing files.
          PORTEIRO_MAX_DIFF_KB: "512"
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_URL: ${{ github.event.pull_request.html_url }}
          REPO: ${{ github.repository }}
        run: python3 "$RUNNER_TEMP/default-branch-gate/porteiro.py" --diff "$RUNNER_TEMP/pr.diff" --nomes "$RUNNER_TEMP/pr.names" --placar "$RUNNER_TEMP/scoreboard.md"

      # Only one comment per PR, updated on every push (--edit-last edits the
      # bot's own last comment; if there is none, it creates one).
      - name: Post the scoreboard on the PR
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          if [ ! -s "$RUNNER_TEMP/scoreboard.md" ]; then
            printf '### 🚪 PR gatekeeper\n\n❌ **NOT ANALYZED** — the analysis step produced no scoreboard.\n' > "$RUNNER_TEMP/scoreboard.md"
          fi
          gh pr comment "$PR" --edit-last --body-file "$RUNNER_TEMP/scoreboard.md" \
            || gh pr comment "$PR" --body-file "$RUNNER_TEMP/scoreboard.md"

      - name: Verdict
        if: steps.analyze.outcome != 'success'
        run: |
          echo "::error title=PR gatekeeper::negative verdict — see the scoreboard on the PR (detail in the private channel)"
          exit 1
