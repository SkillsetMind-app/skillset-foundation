name: Porteiro de PR

# Lê o diff de cada PR e pergunta ao GLM-5: "isto abre alguma porta?".
# Não substitui o Semgrep (padrão conhecido); pega a lógica errada — a classe
# de bug que produziu a moeda sem validação e o base sem head.
#
# Regras que este arquivo obedece (skillset-ops/protecao-glm/ARQUITETURA.md):
#   - Job separado dos existentes: o build do `checks` estoura memória de
#     forma intermitente e não pode esconder o veredito — nem o contrário.
#   - Repo PÚBLICO: o comentário no PR e o log trazem SÓ O PLACAR. O detalhe
#     vai para o canal privado (webhook ops-alert do n8n -> Telegram).
#   - Sem chave => "NÃO ANALISADO" e o check FALHA. Não repetir o `exit 0` que
#     deixou o check de RLS verde por dois meses sem rodar.
#   - PR de fork não recebe secret => cai no caso acima. Não usar
#     pull_request_target com checkout do fork para contornar: é execução de
#     código não confiável com os secrets do repo na mão.
#   - Dependabot também não recebe os secrets do repo; um bump de lockfile não
#     é o que este portão existe para ler, e o `npm audit` já cobre. Fica fora.
#
# Modo: variável do repositório PORTEIRO_MODO = avisa (padrão) | barra.
# Em "barra", achado bloqueante derruba o check. Começa em "avisa" até o
# analisador passar por teste adversarial (instrução plantada no diff).

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

concurrency:
  group: porteiro-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

jobs:
  porteiro:
    name: Porteiro de PR (segurança, GLM-5)
    if: github.event.pull_request.draft == false && github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    # 30: cada reserva de raciocínio leva ~1 min por tentativa (até 3 tetos).
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      # Diff da base até a ponta do PR, SEM pathspec de exclusão: um
      # ':(exclude)*.png' também some com a pasta src/app/api/x.png/. Imagem e
      # fonte binárias saem no script (último segmento do caminho, todos os
      # nomes do bloco, binário de verdade); lockfile é caminho de risco e é lido.
      # --text --no-textconv --no-ext-diff: nem `* -diff` no .gitattributes nem
      # um byte NUL escondem o código atrás de "Binary files ... differ" (o que
      # sobrar assim dá 3 no script).
      # core.quotePath=false: caminho não-ASCII sai cru no cabeçalho. Aspas,
      # barra invertida e controle continuam entre aspas; o script lê as duas
      # formas e dá 3 (não 0) se sobrar cabeçalho que não reconhece.
      # pr.names: o que o PR toca, segundo o git; arquivo que não vier no diff
      # dá PARCIAL (3), nunca 0. Um comando por linha: o teste roda os dois.
      # --no-renames: `git mv src/proxy.ts src/proxy.png` vira apagar + criar,
      # e o modelo lê o código apagado (rename 100% não traz conteúdo nenhum).
      - name: Diff do PR
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          git -c core.quotePath=false diff --no-color --text --no-textconv --no-ext-diff --no-renames "$BASE...$HEAD" > "$RUNNER_TEMP/pr.diff"
          git -c core.quotePath=false diff --name-only -z --no-renames "$BASE...$HEAD" > "$RUNNER_TEMP/pr.names"
          echo "diff: $(wc -c < "$RUNNER_TEMP/pr.diff") bytes"

      # Quem julga o PR é o portão do BRANCH PADRÃO, nunca a cópia do PR nem a
      # da base. `pull_request` faz checkout do merge do PR, e este job recebe os
      # secrets: rodar `scripts/porteiro.py` do checkout é executar código do PR
      # com as chaves na mão. PR de fork não recebe secret, mas PR interno recebe
      # — e um agente com acesso de escrita abre PR interno.
      # A base também não serve: quem abre o PR escolhe o branch base, e poderia
      # apontar para um branch próprio com um portão falso. E base antiga (sem o
      # arquivo, ou de antes do --nomes) deixava o PR vermelho sem análise.
      # O nome do branch padrão vem dos metadados do repositório, que o PR não
      # controla. O fetch nomeado garante a ref (nunca FETCH_HEAD).
      # `cat-file blob`, não `show`: é o comando de encanamento cuja saída é o
      # blob cru, sem textconv, filtro ou conversão de fim de linha (isso só com
      # --filters/--textconv, que não usamos). O .gitattributes do PR não tem
      # como mexer nos bytes do portão que vai julgá-lo.
      # `git fetch` ou `git cat-file` falham => o passo falha => check vermelho.
      # SEM timeout-minutes de propósito: test_E toma o MENOR timeout-minutes do
      # arquivo como teto da cadeia. E o destino não pode ser "$RUNNER_TEMP/pr.*":
      # comandos_do_workflow() casa esse padrão para rodar o diff de verdade.
      # Não fecha sozinho o furo: este arquivo ainda é a cópia do PR.
      - name: Extrai o portão do branch padrão
        env:
          PADRAO: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          git fetch --no-tags origin "+refs/heads/$PADRAO:refs/remotes/origin/$PADRAO"
          mkdir -p "$RUNNER_TEMP/portao-do-padrao"
          git cat-file blob "origin/$PADRAO:scripts/porteiro.py" > "$RUNNER_TEMP/portao-do-padrao/porteiro.py"
          echo "portão de origin/$PADRAO ($(git rev-parse --short "origin/$PADRAO")): $(wc -c < "$RUNNER_TEMP/portao-do-padrao/porteiro.py") bytes"

      # continue-on-error: o placar precisa ser publicado mesmo quando o
      # veredito é "não analisado" ou "bloqueante". O passo final replica a falha.
      # Cadeia de reserva: sem veredito do GLM (sem saldo, chave recusada,
      # API fora), tenta Kimi k3 -> Kimi k2.6 -> OpenAI. Secret que não existe
      # chega vazio e o provedor é pulado. vars.PORTEIRO_CADEIA muda ordem/modelos.
      - name: Analisa com o GLM-5 (e reservas)
        id: analisa
        continue-on-error: true
        # A cadeia para sozinha em PRAZO_TOTAL (25 min, scripts/porteiro.py);
        # 27 garante que o placar ainda seja publicado dentro dos 30 do job.
        timeout-minutes: 27
        env:
          GLM_API_KEY: ${{ secrets.GLM_API_KEY }}
          KIMI_API_KEY: ${{ secrets.KIMI_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          PORTEIRO_CADEIA: ${{ vars.PORTEIRO_CADEIA }}
          OPS_ALERT_WEBHOOK_URL: ${{ secrets.OPS_ALERT_WEBHOOK_URL }}
          OPS_ALERT_WEBHOOK_SECRET: ${{ secrets.OPS_ALERT_WEBHOOK_SECRET }}
          PORTEIRO_MODO: ${{ vars.PORTEIRO_MODO || 'avisa' }}
          PORTEIRO_MODELO: ${{ vars.PORTEIRO_MODELO || 'glm-5' }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_URL: ${{ github.event.pull_request.html_url }}
          REPO: ${{ github.repository }}
        run: python3 "$RUNNER_TEMP/portao-do-padrao/porteiro.py" --diff "$RUNNER_TEMP/pr.diff" --nomes "$RUNNER_TEMP/pr.names" --placar "$RUNNER_TEMP/placar.md"

      # Um comentário só por PR, atualizado a cada push (--edit-last edita o
      # último comentário do próprio bot; se não existe, cria).
      - name: Publica o placar no PR
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          if [ ! -s "$RUNNER_TEMP/placar.md" ]; then
            printf '### 🚪 Porteiro de PR\n\n❌ **NÃO ANALISADO** — o passo de análise não produziu placar.\n' > "$RUNNER_TEMP/placar.md"
          fi
          gh pr comment "$PR" --edit-last --body-file "$RUNNER_TEMP/placar.md" \
            || gh pr comment "$PR" --body-file "$RUNNER_TEMP/placar.md"

      - name: Veredito
        if: steps.analisa.outcome != 'success'
        run: |
          echo "::error title=Porteiro de PR::veredito negativo — veja o placar no PR (detalhe no canal privado)"
          exit 1
