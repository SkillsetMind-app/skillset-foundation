name: CI

permissions:
  contents: read

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # O porteiro de PR é portão de segurança: seus testes rodam neste job
      # (check obrigatório), antes do npm, para que um PR que o quebre não mescle.
      - name: Porteiro self-tests (python)
        run: |
          set -euo pipefail
          python3 -m unittest scripts/test_porteiro.py
          python3 scripts/porteiro.py --demo

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies (app)
        run: npm ci

      - name: Lint (app)
        run: npm run lint

      - name: Typecheck (app)
        run: npx tsc --noEmit

      - name: Unit tests (vitest)
        id: unit
        run: npx vitest run

      # .env.production is tracked and carries ONLY publishable NEXT_PUBLIC_*
      # values, so the production build works in CI without extra secrets.
      - name: Build (next)
        run: npm run build

      - name: Certificate browser and A4 checks (synthetic only)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends poppler-utils python3-pypdf
          node scripts/check-certificate-visual.mjs

      - name: Certificate visual fixtures (synthetic only)
        if: always() && steps.unit.outcome == 'success'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: certificate-visual-fixtures
          path: /tmp/skillsetmind-certificate-ssr-*/
          if-no-files-found: error
          retention-days: 3

  # Os smoke tests de RLS em supabase/tests/ existem desde julho e nunca foram
  # executados. Até aqui eles dependiam do secret STAGING_DATABASE_URL, que
  # nunca existiu no repositório: sem ele o passo emitia um ::warning e saía com
  # `exit 0`, então o check ficava VERDE sem ter rodado teste nenhum. Um portão
  # que aprova por omissão é pior que portão nenhum.
  #
  # A dependência do secret foi removida, não remendada. O job levanta um
  # Postgres descartável no próprio runner e monta nele o esquema do
  # repositório (scripts/build-test-db.sh). Consequências:
  #
  #   - não há credencial para faltar, então não existe caminho que passe verde
  #     sem rodar: se o banco não sobe, se o seed não aplica ou se um teste
  #     falha, o job falha;
  #   - PR vindo de fork roda igual (fork não recebe secret, e aqui não há
  #     secret a receber);
  #   - o banco de produção nunca é tocado. Estes testes escrevem.
  rls:
    name: RLS smoke tests (banco efêmero)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Sem `npm ci`: scripts/run-supabase-tests.mjs só usa builtins do Node e
      # o psql que já vem no runner.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22

      - uses: supabase/setup-cli@bea637206310b05056109c4ffab256b2c3c522af
        with:
          version: 2.39.2

      # A CLI serve só para levantar um Postgres com o schema auth, os papéis
      # (anon/authenticated/service_role) e a versão que produção usa. O esquema
      # da aplicação NÃO vem daqui: `supabase db start` aplicaria
      # supabase/migrations/, que não replica do zero — a segunda migration
      # altera uma policy de public.course_assets, tabela que só nasce no
      # baseline de 2026-07-15. Por isso o diretório sai do caminho e volta logo
      # depois. O porquê está inteiro em scripts/build-test-db.sh.
      - name: Sobe um Postgres do Supabase, vazio
        run: |
          set -euo pipefail
          mv supabase/migrations supabase/.migrations-historico
          mkdir supabase/migrations
          supabase db start
          rmdir supabase/migrations
          mv supabase/.migrations-historico supabase/migrations

      # baseline replayável de 2026-07-21 + as 46 migrations posteriores + seed.
      - name: Aplica o esquema do repositório
        run: |
          set -euo pipefail
          eval "$(supabase status -o env | grep '^DB_URL=')"
          if [ -z "${DB_URL:-}" ]; then
            echo "::error title=Banco efêmero não subiu::supabase status não devolveu DB_URL; os smoke tests de RLS não têm onde rodar."
            exit 1
          fi
          echo "DATABASE_URL=$DB_URL" >> "$GITHUB_ENV"
          DATABASE_URL="$DB_URL" bash scripts/build-test-db.sh

      - name: RLS smoke tests (supabase/tests)
        run: npm run test:db

      - name: Compra avulsa concorrente (duas conexoes reais)
        timeout-minutes: 3
        run: node scripts/check-order-concurrency.mjs

      - name: Prova por reversao da trava do pedido
        timeout-minutes: 3
        run: |
          set +e
          output=$(WITHOUT_ORDER_ROW_LOCK=1 node scripts/check-order-concurrency.mjs 2>&1)
          status=$?
          set -e
          printf '%s\n' "$output"
          test "$status" -ne 0
          printf '%s\n' "$output" | grep -Fqx '[order-concurrency] PASS paid-wins-no-coupon-overlap'
          printf '%s\n' "$output" | grep -Fqx '[order-concurrency] PASS functions-restored'
          printf '%s\n' "$output" | grep -Fqx '[order-concurrency] PASS cleanup'
          expected=$(printf '%s\n' '[order-concurrency] FAIL paid-wins-no-coupon-outcome' '[order-concurrency] FAIL paid-wins-no-coupon-state' '[order-concurrency] FAIL assertions')
          actual=$(printf '%s\n' "$output" | grep -F '[order-concurrency] FAIL')
          test "$actual" = "$expected"

      - name: Real Auth invite security (GoTrue ephemeral)
        timeout-minutes: 5
        run: node scripts/check-invite-auth.mjs

      - name: Prova por reversao da revogacao Auth
        timeout-minutes: 5
        run: |
          set +e
          output=$(WITHOUT_INVITE_AUTH_REVOCATION=1 node scripts/check-invite-auth.mjs 2>&1)
          status=$?
          set -e
          printf '%s\n' "$output"
          test "$status" -ne 0
          printf '%s\n' "$output" | grep -Fqx '[invite-auth] FAIL old-session-cannot-reinstall-password'
          printf '%s\n' "$output" | grep -Fqx '[invite-auth] FAIL security-assertions'
