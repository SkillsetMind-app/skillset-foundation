name: CI

permissions:
  contents: read

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # The PR gatekeeper ("porteiro") is a security gate: its tests run in this
      # job (a required check), before npm, so a PR that breaks it cannot merge.
      - name: PR gatekeeper self-tests (python)
        run: |
          set -euo pipefail
          python3 -m unittest scripts/test_porteiro.py
          python3 scripts/porteiro.py --demo

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies (app)
        run: npm ci

      - name: Lint (app)
        run: npm run lint

      - name: Typecheck (app)
        run: npx tsc --noEmit

      - name: Unit tests (vitest)
        id: unit
        run: npx vitest run

      # .env.production is tracked and carries ONLY publishable NEXT_PUBLIC_*
      # values, so the production build works in CI without extra secrets.
      - name: Build (next)
        run: npm run build

      - name: Certificate browser and A4 checks (synthetic only)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends poppler-utils python3-pypdf
          node scripts/check-certificate-visual.mjs

      - name: Certificate visual fixtures (synthetic only)
        if: always() && steps.unit.outcome == 'success'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: certificate-visual-fixtures
          path: /tmp/skillsetmind-certificate-ssr-*/
          if-no-files-found: error
          retention-days: 3

  # The RLS smoke tests in supabase/tests/ have existed since July and were
  # never run. Until now they depended on the STAGING_DATABASE_URL secret, which
  # never existed in the repository: without it the step emitted a ::warning and
  # exited with `exit 0`, so the check was GREEN without having run a single
  # test. A gate that passes by omission is worse than no gate.
  #
  # The secret dependency was removed, not patched. The job starts a disposable
  # Postgres on the runner itself and builds the repository schema in it
  # (scripts/build-test-db.sh). Consequences:
  #
  #   - there is no credential to be missing, so there is no path that goes
  #     green without running: if the database does not start, if the seed does
  #     not apply, or if a test fails, the job fails;
  #   - a PR from a fork runs the same way (a fork gets no secret, and here
  #     there is no secret to get);
  #   - the production database is never touched. These tests write.
  rls:
    name: RLS smoke tests (ephemeral database)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # No `npm ci`: scripts/run-supabase-tests.mjs only uses Node builtins and
      # the psql that already ships on the runner.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22

      - uses: supabase/setup-cli@bea637206310b05056109c4ffab256b2c3c522af
        with:
          version: 2.39.2

      # The CLI is only used to start a Postgres with the auth schema, the roles
      # (anon/authenticated/service_role) and the version production uses. The
      # application schema does NOT come from here: `supabase db start` would
      # apply supabase/migrations/, which does not replay from scratch — the
      # second migration alters a policy on public.course_assets, a table that
      # only appears in the 2026-07-15 baseline. That is why the directory is
      # moved out of the way and put back right after. The full reason is in
      # scripts/build-test-db.sh.
      - name: Start an empty Supabase Postgres
        run: |
          set -euo pipefail
          mv supabase/migrations supabase/.migrations-history
          mkdir supabase/migrations
          supabase db start
          rmdir supabase/migrations
          mv supabase/.migrations-history supabase/migrations

      # replayable baseline of 2026-07-21 + the 46 later migrations + seed.
      - name: Apply the repository schema
        run: |
          set -euo pipefail
          eval "$(supabase status -o env | grep '^DB_URL=')"
          if [ -z "${DB_URL:-}" ]; then
            echo "::error title=Ephemeral database did not start::supabase status did not return DB_URL; the RLS smoke tests have nowhere to run."
            exit 1
          fi
          echo "DATABASE_URL=$DB_URL" >> "$GITHUB_ENV"
          DATABASE_URL="$DB_URL" bash scripts/build-test-db.sh

      - name: RLS smoke tests (supabase/tests)
        run: npm run test:db

      - name: Concurrent single purchase (two real connections)
        timeout-minutes: 3
        run: node scripts/check-order-concurrency.mjs

      - name: Revert proof of the order row lock
        timeout-minutes: 3
        run: |
          set +e
          output=$(WITHOUT_ORDER_ROW_LOCK=1 node scripts/check-order-concurrency.mjs 2>&1)
          status=$?
          set -e
          printf '%s\n' "$output"
          test "$status" -ne 0
          printf '%s\n' "$output" | grep -Fqx '[order-concurrency] PASS paid-wins-no-coupon-overlap'
          printf '%s\n' "$output" | grep -Fqx '[order-concurrency] PASS functions-restored'
          printf '%s\n' "$output" | grep -Fqx '[order-concurrency] PASS cleanup'
          expected=$(printf '%s\n' '[order-concurrency] FAIL paid-wins-no-coupon-outcome' '[order-concurrency] FAIL paid-wins-no-coupon-state' '[order-concurrency] FAIL assertions')
          actual=$(printf '%s\n' "$output" | grep -F '[order-concurrency] FAIL')
          test "$actual" = "$expected"

      - name: Concurrent certificate and refund (two real connections)
        timeout-minutes: 3
        run: node scripts/check-certificate-concurrency.mjs

      - name: Revert proof of the enrollment lock
        timeout-minutes: 3
        run: |
          set +e
          output=$(WITHOUT_CERTIFICATE_ENROLLMENT_LOCK=1 node scripts/check-certificate-concurrency.mjs 2>&1)
          status=$?
          set -e
          printf '%s\n' "$output"
          test "$status" -ne 0
          printf '%s\n' "$output" | grep -Fqx '[certificate-concurrency] PASS refund-first-overlap'
          printf '%s\n' "$output" | grep -Fqx '[certificate-concurrency] PASS function-restored'
          printf '%s\n' "$output" | grep -Fqx '[certificate-concurrency] PASS cleanup'
          expected=$(printf '%s\n' '[certificate-concurrency] FAIL refund-first-state' '[certificate-concurrency] FAIL refund-first-rejected' '[certificate-concurrency] FAIL assertions')
          actual=$(printf '%s\n' "$output" | grep -F '[certificate-concurrency] FAIL')
          test "$actual" = "$expected"

      - name: Real Auth invite security (GoTrue ephemeral)
        timeout-minutes: 5
        run: node scripts/check-invite-auth.mjs

      - name: Revert proof of the Auth session revocation
        timeout-minutes: 5
        run: |
          set +e
          output=$(WITHOUT_INVITE_AUTH_REVOCATION=1 node scripts/check-invite-auth.mjs 2>&1)
          status=$?
          set -e
          printf '%s\n' "$output"
          test "$status" -ne 0
          printf '%s\n' "$output" | grep -Fqx '[invite-auth] FAIL old-session-cannot-reinstall-password'
          printf '%s\n' "$output" | grep -Fqx '[invite-auth] FAIL security-assertions'
