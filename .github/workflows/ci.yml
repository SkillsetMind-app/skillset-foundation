name: CI

permissions:
  contents: read

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies (app)
        run: npm ci

      - name: Lint (app)
        run: npm run lint

      - name: Typecheck (app)
        run: npx tsc --noEmit

      - name: Unit tests (vitest)
        run: npx vitest run

      # .env.production is tracked and carries ONLY publishable NEXT_PUBLIC_*
      # values, so the production build works in CI without extra secrets.
      - name: Build (next)
        run: npm run build

  # Os smoke tests de RLS em supabase/tests/ existem desde julho e nunca foram
  # executados. Até aqui eles dependiam do secret STAGING_DATABASE_URL, que
  # nunca existiu no repositório: sem ele o passo emitia um ::warning e saía com
  # `exit 0`, então o check ficava VERDE sem ter rodado teste nenhum. Um portão
  # que aprova por omissão é pior que portão nenhum.
  #
  # A dependência do secret foi removida, não remendada. O job levanta um
  # Postgres descartável no próprio runner e monta nele o esquema do
  # repositório (scripts/build-test-db.sh). Consequências:
  #
  #   - não há credencial para faltar, então não existe caminho que passe verde
  #     sem rodar: se o banco não sobe, se o seed não aplica ou se um teste
  #     falha, o job falha;
  #   - PR vindo de fork roda igual (fork não recebe secret, e aqui não há
  #     secret a receber);
  #   - o banco de produção nunca é tocado. Estes testes escrevem.
  rls:
    name: RLS smoke tests (banco efêmero)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      # Sem `npm ci`: scripts/run-supabase-tests.mjs só usa builtins do Node e
      # o psql que já vem no runner.
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22

      - uses: supabase/setup-cli@aa3515eac405eac768fa4a72147c22d88a283c7b
        with:
          version: 2.39.2

      # A CLI serve só para levantar um Postgres com o schema auth, os papéis
      # (anon/authenticated/service_role) e a versão que produção usa. O esquema
      # da aplicação NÃO vem daqui: `supabase db start` aplicaria
      # supabase/migrations/, que não replica do zero — a segunda migration
      # altera uma policy de public.course_assets, tabela que só nasce no
      # baseline de 2026-07-15. Por isso o diretório sai do caminho e volta logo
      # depois. O porquê está inteiro em scripts/build-test-db.sh.
      - name: Sobe um Postgres do Supabase, vazio
        run: |
          set -euo pipefail
          mv supabase/migrations supabase/.migrations-historico
          mkdir supabase/migrations
          supabase db start
          rmdir supabase/migrations
          mv supabase/.migrations-historico supabase/migrations

      # baseline replayável de 2026-07-21 + as 46 migrations posteriores + seed.
      - name: Aplica o esquema do repositório
        run: |
          set -euo pipefail
          eval "$(supabase status -o env | grep '^DB_URL=')"
          if [ -z "${DB_URL:-}" ]; then
            echo "::error title=Banco efêmero não subiu::supabase status não devolveu DB_URL; os smoke tests de RLS não têm onde rodar."
            exit 1
          fi
          echo "DATABASE_URL=$DB_URL" >> "$GITHUB_ENV"
          DATABASE_URL="$DB_URL" bash scripts/build-test-db.sh

      - name: RLS smoke tests (supabase/tests)
        run: npm run test:db
