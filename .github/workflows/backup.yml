name: Backup

# Off-site copy of the database and Storage objects.
#
# Supabase already takes its own daily backups, kept 7 days, in the same account
# as the data — and they exclude Storage objects. This job covers what those
# don't: losing access to the account, damage found after a week, and the files
# themselves. The archive is encrypted before it leaves the runner, so the
# destination never holds readable user data.

on:
  schedule:
    # 04:10 UTC — after Supabase's own ~00:00 regional snapshot, off peak.
    - cron: "10 4 * * *"
  workflow_dispatch:

concurrency:
  group: backup
  cancel-in-progress: false

jobs:
  backup:
    name: Dump, encrypt, ship
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v7

      # Without the secrets this job would "pass" while backing up nothing,
      # which is the failure mode that hurts most: a green tick and no data.
      - name: Check configuration
        env:
          DATABASE_URL: ${{ secrets.BACKUP_DATABASE_URL }}
          AGE_PUBLIC_KEY: ${{ secrets.BACKUP_AGE_PUBLIC_KEY }}
          SERVICE_ROLE: ${{ secrets.BACKUP_SERVICE_ROLE_KEY }}
        run: |
          missing=""
          [ -n "$DATABASE_URL" ]   || missing="$missing BACKUP_DATABASE_URL"
          [ -n "$AGE_PUBLIC_KEY" ] || missing="$missing BACKUP_AGE_PUBLIC_KEY"
          [ -n "$SERVICE_ROLE" ]   || missing="$missing BACKUP_SERVICE_ROLE_KEY"
          if [ -n "$missing" ]; then
            echo "::error title=Backup not configured::Missing secrets:$missing — see docs/BACKUP.md. No backup was taken."
            exit 1
          fi

      # Server is Postgres 17; pg_dump must be >= the server or it refuses.
      #
      # Installing the package is not enough: the runner image ships its own
      # Postgres 16 client at /usr/bin/pg_dump, which wins the PATH and makes
      # the dump abort on "server version mismatch". So put the 17 binaries in
      # front, and assert the version instead of just printing it — the first
      # run of this job printed "16.15" right here and nobody noticed.
      - name: Install postgresql-client-17
        run: |
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -fsSL -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc \
            https://www.postgresql.org/media/keys/ACCC4CF8.asc
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] \
            https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" \
            | sudo tee /etc/apt/sources.list.d/pgdg.list > /dev/null
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client-17
          echo "/usr/lib/postgresql/17/bin" >> "$GITHUB_PATH"
          ver=$(/usr/lib/postgresql/17/bin/pg_dump --version | grep -oE '[0-9]+' | head -1)
          echo "pg_dump major: $ver"
          [ "$ver" -ge 17 ] || { echo "::error title=pg_dump too old::got $ver, need >= 17"; exit 1; }

      - name: Install age
        run: sudo apt-get install -y -qq age

      - name: Create backup
        id: backup
        env:
          DATABASE_URL: ${{ secrets.BACKUP_DATABASE_URL }}
          SUPABASE_URL: ${{ secrets.BACKUP_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.BACKUP_SERVICE_ROLE_KEY }}
          AGE_PUBLIC_KEY: ${{ secrets.BACKUP_AGE_PUBLIC_KEY }}
        run: |
          chmod +x scripts/backup-supabase.sh
          ./scripts/backup-supabase.sh ./backup-out | tee /tmp/backup.log
          grep '^BACKUP_FILE=' /tmp/backup.log >> "$GITHUB_OUTPUT"

      - name: Install rclone
        run: sudo apt-get install -y -qq rclone

      # R2 speaks the S3 API. The token is scoped to this bucket with Object
      # Write only — a leaked CI token must not be able to read old backups or
      # delete them. That is why nothing here lists or removes objects:
      # --no-check-dest skips the destination listing rclone would otherwise do,
      # which a write-only token cannot perform.
      - name: Upload to Cloudflare R2
        env:
          RCLONE_CONFIG_R2_TYPE: s3
          RCLONE_CONFIG_R2_PROVIDER: Cloudflare
          RCLONE_CONFIG_R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          RCLONE_CONFIG_R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          RCLONE_CONFIG_R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          RCLONE_CONFIG_R2_NO_CHECK_BUCKET: "true"
          BUCKET: ${{ secrets.R2_BUCKET }}
          FILE: ${{ steps.backup.outputs.BACKUP_FILE }}
        run: |
          rclone copyto "$FILE" "R2:$BUCKET/daily/$(basename "$FILE")" \
            --s3-no-head --no-check-dest --stats-one-line

      # Retention is a lifecycle rule on the bucket itself (objects under
      # daily/ expire after 30 days), not a step here. Pruning from CI would
      # mean handing CI a token that can delete backups, and a token that can
      # delete backups is a token that deletes them once it leaks. 30 days
      # covers the gap left by Supabase's 7.
      #   verify: GET /accounts/<acc>/r2/buckets/skillsetmind-backups/lifecycle

      - name: Summary
        if: always()
        env:
          FILE: ${{ steps.backup.outputs.BACKUP_FILE }}
        run: |
          {
            echo "### Backup"
            echo ""
            if [ -f "$FILE" ]; then
              echo "- archive: \`$(basename "$FILE")\`"
              echo "- size: $(wc -c < "$FILE" | tr -d ' ') bytes (encrypted)"
              echo "- sha256: \`$(sha256sum "$FILE" | cut -d' ' -f1)\`"
              echo "- destination: R2 \`daily/\`, expires after 30 days"
            else
              echo "- **no archive produced**"
            fi
            echo ""
            echo "Restore drill: \`./scripts/restore-backup.sh <file>\` — see docs/BACKUP.md"
          } >> "$GITHUB_STEP_SUMMARY"
