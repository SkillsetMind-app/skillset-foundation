version: 2
updates:
  # A single group with `patterns: ["*"]` bundles everything into one PR: one
  # transitive bump that breaks the build is enough to stall the whole batch,
  # and a security patch ends up waiting behind it, unnoticed, against a cap of
  # 5 open PRs. That is why patch and minor travel separately: patch is where
  # the security fixes live and it almost never breaks, so it goes on its own,
  # fast; minor can carry new behavior and deserves its own review.
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"
    ignore:
      # jsdom is pinned to the current version: the new minor breaks a test;
      # review it separately. Patches still go through.
      - dependency-name: "jsdom"
        update-types:
          - "version-update:semver-minor"
          - "version-update:semver-major"
    groups:
      patch:
        patterns:
          - "*"
        update-types:
          - "patch"
      minor:
        patterns:
          - "*"
        update-types:
          - "minor"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 3
    commit-message:
      prefix: "chore(deps)"
    groups:
      patch:
        patterns:
          - "*"
        update-types:
          - "patch"
      minor:
        patterns:
          - "*"
        update-types:
          - "minor"
